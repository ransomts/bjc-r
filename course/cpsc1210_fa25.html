    <script>
      // Wait for the entire HTML document to be loaded
      document.addEventListener('DOMContentLoaded', function() {
          // --- SET YOUR RELEASE DATES HERE ---
          // NOTE: JavaScript months are 0-indexed (0=Jan, 1=Feb, ..., 11=Dec)
          const releaseDates = [
              new Date('2025-08-15T10:30:00'), // Topic 1: Welcome to Snap!
              new Date('2025-08-26T10:30:00'), // Topic 2: Build Your Own Blocks!
              new Date('2025-09-02T10:30:00'), // Topic 3: Conditionals

              // To add more, uncomment the HTML above and add a new Date object here.
          ];

          // Get the current time
          const now = new Date();

          // Select all elements with the class 'topic_link'
          const topics = document.querySelectorAll('.topic_link');

          // Loop through each topic element
          topics.forEach((topic, index) => {
              // Hide every topic by default
              topic.style.display = 'none';

              // Check if a release date is defined for the current topic
              if (releaseDates[index]) {
		  // If the current date is on or after the release date, show the topic
		  if (now >= releaseDates[index]) {
		      topic.style.display = 'block';
		  }
              }
          });
      });
    </script>
